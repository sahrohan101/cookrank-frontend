<!DOCTYPE html>
<html>
<head>
  <title>Register User</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;">
<div class="card" style="width:300px;text-align:center;">
  <h2>Add User</h2>
  <input id="username" placeholder="Username"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>
  <button onclick="register()" class="btn primary">Register</button>
  <p id="msg" style="color:red;margin-top:10px;"></p>
</div>

<script src="script.js"></script>
<script>
async function register() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const res = await fetch(`${API}/register`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({username,password})
  });
  
  const data = await res.json();

  if(data.username){
    document.getElementById("msg").style.color="lightgreen";
    document.getElementById("msg").textContent = "Registered Successfully!";
  } else {
    document.getElementById("msg").textContent = data.error;
  }
}
</script>
</body>
</html>
